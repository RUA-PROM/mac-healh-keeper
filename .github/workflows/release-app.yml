# Mac Health Keeper - Release artifact (.app zip) attach workflow
#
# issue: 20260529_123114_CIバージョンstamp_B案実装（3D667BE0-934D-4FC6-B7D0-C423CF45B03F）
#
# 役割:
#   既存 `create-release.yaml`（ubuntu-latest）が日時 tag を作成するのを契機に、
#   本 workflow（macos-latest）が `.app` を組み立て・package し、生成された
#   `MacHealth-<version>.zip` を Release artifact として添付する。
#
# 設計判断:
#   - 既存 `create-release.yaml` の振る舞いは変えない（最小修正・役割分離）。
#   - trigger は tag push（`v*`）。tag-on-push の連鎖はループ防止のため
#     `push: branches: [main]` ではなく `push: tags`。create-release.yaml が
#     `git push origin <TAG>` した時点で本 workflow が起動する。
#   - actions/checkout は `fetch-depth: 0` + `fetch-tags: true`（tag 履歴必須）。
#   - artifact 検証は scripts/lib/release_artifact_validator.sh で
#     CFBundleVersion = git describe 期待値の厳格一致を確認。
#   - artifact 添付は `gh release upload` を直接使用（workflow_dispatch 時の
#     target_commitish immutable エラーを回避する目的。汎用 release action は使わない）。

name: Release artifact (.app)

on:
  push:
    tags:
      - "v*"
  # ローカル/手動デバッグ用の手動起動経路も用意（既存 release を上書きしないよう注意）
  workflow_dispatch:
    inputs:
      tag:
        description: "添付対象の既存 tag（例: v20260529.210908）。tag push 経路と排他で使う。"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attach:
    name: Build .app and attach to Release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Resolve target tag
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            # push: tags 経路。github.ref は refs/tags/<tag>
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "ERROR: failed to resolve target tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target tag: $tag"

      - name: Checkout repository (with full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.resolve_tag.outputs.tag }}

      - name: Ensure shellcheck
        shell: bash
        run: |
          set -eo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck already available: $(shellcheck --version | head -n1 | awk '{print $2}')"
          else
            echo "shellcheck not found; installing via Homebrew"
            brew install shellcheck
          fi

      - name: Verify git describe (shallow clone guard)
        shell: bash
        run: |
          set -euo pipefail
          desc="$(git describe --tags --always)"
          echo "git describe --tags --always: $desc"
          if [ "$desc" = "0.0.0-DEV" ]; then
            echo "::warning::git describe fell back to 0.0.0-DEV; check fetch-depth/fetch-tags"
          fi
          # 期待 tag が含まれるか（resolve_tag の出力と比較）。
          expected="${{ steps.resolve_tag.outputs.tag }}"
          case "$desc" in
            "$expected"*) echo "git describe starts with target tag: ok" ;;
            *) echo "::warning::git describe ($desc) does not start with target tag ($expected)" ;;
          esac

      - name: Run make check (regression guard)
        shell: bash
        run: make check

      - name: Build .app bundle
        shell: bash
        run: |
          set -euo pipefail
          make build
          ls -la build/MacHealth.app/Contents/MacOS/MacHealth build/MacHealth.app/Contents/Info.plist
          # CFBundleVersion をログに出す
          cfv="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/MacHealth.app/Contents/Info.plist)"
          echo "CFBundleVersion: $cfv"
          echo "CFBUNDLE_VERSION=$cfv" >> "$GITHUB_ENV"

      - name: Package .app -> zip
        shell: bash
        run: |
          set -euo pipefail
          make package
          ls -la build/MacHealth-*.zip
          # 添付対象 zip パスを GITHUB_ENV に書き出す
          zip_path="$(ls build/MacHealth-*.zip | head -n1)"
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo "ZIP_BASENAME=$(basename "$zip_path")" >> "$GITHUB_ENV"

      - name: Validate release artifact
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/lib/release_artifact_validator.sh \
            "$ZIP_PATH" \
            "$CFBUNDLE_VERSION" \
            "$PWD"

      - name: Create Release with .app.zip attached (atomic)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Immutable Releases (リポジトリ設定) 環境では、Release が作成された時点で
          # asset/body 追加が拒否される。そのため `gh release create` で .app zip と
          # release notes を同時に投入し、初回作成時に必要なものを全て埋め込む。
          # create-release.yaml は tag 作成と本 workflow の dispatch のみを担当し、
          # Release の作成は本 step で行う契約に変更した（hotfix #3）。

          # release notes を一時ファイルに書き出す
          notes_file=$(mktemp)
          {
            printf '## Mac Health Keeper %s\n\n' "$TAG"
            printf 'macOS-latest CI でビルド・添付された `.app` artifact 入り Release。\n\n'
            printf '## .app artifact\n\n'
            printf -- '- Filename: `%s`\n' "$ZIP_BASENAME"
            printf -- '- CFBundleVersion: `%s`\n' "$CFBUNDLE_VERSION"
            printf -- '- Built on: `macos-latest` via `.github/workflows/release-app.yml`\n\n'
            printf '### Gatekeeper 回避（署名なし配布）\n\n'
            printf '```bash\n'
            printf 'xattr -dr com.apple.quarantine MacHealth.app\n'
            printf '# または初回起動時に右クリック → 開く\n'
            printf '```\n\n'
            printf '> 本 artifact は署名・公証なしの開発用配布です。\n'
          } > "$notes_file"

          # 既に同 tag の Release が存在する場合（hotfix 経路や手動再実行）はスキップ。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; cannot mutate (immutable). skipping create."
            # 既存 Release が asset 0 件なら警告を残す（手動対応が必要）。
            asset_count=$(gh release view "$TAG" --json assets -q '.assets | length')
            if [ "$asset_count" -eq 0 ]; then
              echo "::warning::existing immutable release $TAG has 0 assets and cannot be backfilled by CI"
            fi
            exit 0
          fi

          # Release を新規作成（生成 notes + .app zip を同時に投入）。
          # --target は tag の指し示す commit (= main 直前 commit) と一致させる。
          target_sha="$(git rev-parse "$TAG^{commit}")"
          echo "creating release $TAG (target=$target_sha) with $ZIP_PATH"
          gh release create "$TAG" "$ZIP_PATH" \
            --target "$target_sha" \
            --title "$TAG" \
            --notes-file "$notes_file"
