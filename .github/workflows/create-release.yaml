# main へのマージ時に GitHub Release を自動作成する
# タグは日時ベース（vYYYYMMDD.HHMMSS JST）、リリースノートは自動生成
name: Release 作成

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release 作成
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: タグ作成と Release 公開
        id: create_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(TZ=Asia/Tokyo date '+%Y%m%d.%H%M%S')"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # issue: 20260529_123114_CIバージョンstamp_B案実装（B 案）
      # 役割分離: tag/Release 生成は本 workflow（ubuntu-latest）、
      #          .app artifact 組み立て + 添付は release-app.yml（macos-latest）。
      # GITHUB_TOKEN で作成した tag は他 workflow を起動しないため、
      # ここから明示的に workflow_dispatch で release-app.yml を呼び出す。
      - name: .app artifact 添付ワークフローを起動
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.create_tag.outputs.tag }}"
          echo "dispatch release-app.yml for tag=$TAG"
          gh workflow run release-app.yml \
            --ref main \
            --field tag="$TAG"
